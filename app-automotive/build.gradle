plugins {
    alias(libs.plugins.android.application)
}
apply from: "../common.gradle"

def appBuildFile = file("../app/build.gradle").text
def appVersionCodeMatch = appBuildFile =~ /versionCode\s*=?\s*(\d+)/
def appVersionNameMatch = appBuildFile =~ /versionName\s*=?\s*"([^"]+)"/
if (!appVersionCodeMatch.find() || !appVersionNameMatch.find()) {
    throw new GradleException("Unable to read versionCode/versionName from app/build.gradle")
}
def appVersionCode = appVersionCodeMatch.group(1) as int
def appVersionName = appVersionNameMatch.group(1)

android {
    namespace "de.danoeh.antennapod.automotive"

    defaultConfig {
        applicationId "de.danoeh.antennapod"
        minSdk 28
        versionCode 1000000000 + appVersionCode
        versionName appVersionName
        missingDimensionStrategy "market", "free"
    }

    signingConfigs {
        releaseConfig {
            enableV1Signing true
            enableV2Signing true
            storeFile file(project.getProperties().getOrDefault("releaseStoreFile", "keystore"))
            storePassword project.getProperties().getOrDefault("releaseStorePassword", "password")
            keyAlias project.getProperties().getOrDefault("releaseKeyAlias", "alias")
            keyPassword project.getProperties().getOrDefault("releaseKeyPassword", "password")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.releaseConfig
        }
    }

    lint {
        disable "MissingMediaBrowserServiceIntentFilter", "UnusedResources", "ObsoleteSdkInt", "RtlHardcoded", "RtlEnabled"
    }
}

dependencies {
    implementation project(":event")
    implementation project(":model")
    implementation project(":net:common")
    implementation project(":net:discovery")
    implementation project(":net:download:service-interface")
    implementation project(":net:download:service")
    implementation project(":net:ssl")
    implementation project(":net:sync:service-interface")
    implementation project(":net:sync:service")
    implementation project(":parser:feed")
    implementation project(":playback:service")
    implementation project(":storage:database")
    implementation project(":storage:database-maintenance-service")
    implementation project(":storage:preferences")
    implementation project(":ui:common")
    implementation project(":ui:discovery")
    implementation project(":ui:glide")
    implementation project(":ui:i18n")
    implementation project(":ui:notifications")
    implementation project(":ui:preferences")

    implementation libs.androidx.appcompat
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    implementation libs.androidx.work.runtime
    implementation libs.google.material
    implementation libs.eventbus
    implementation libs.rxandroid
    implementation libs.rxjava
}
